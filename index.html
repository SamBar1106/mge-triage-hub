<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MGE Training Scheduling & Triage Hub</title>
  <link rel="stylesheet" href="css/styles.css?v=15" />
</head>
<body>
  <!-- Top Navigation Header -->
  <header class="ios-header">
    <div class="header-left">
      <h1>Scheduling Hub</h1>
    </div>
    
    <!-- Compact KPIs directly in header for max vertical space -->
    <div class="header-kpis">
      <div class="mini-kpi" title="Pending for Schedule Value">
        <span class="mini-kpi-label">Pending</span>
        <span id="kpi-pending-val">$0.00</span>
      </div>
      <div class="mini-kpi" title="Schedule Incomplete Value">
        <span class="mini-kpi-label">Incomplete</span>
        <span id="kpi-incomplete-val">$0.00</span>
      </div>
      <div class="mini-kpi">
        <span class="mini-kpi-label">Doctors in View</span>
        <span id="kpi-clients-count">0</span>
      </div>
      <div class="mini-kpi">
        <span class="mini-kpi-label">Completed</span>
        <span id="kpi-complete-count">0</span>
      </div>
    </div>
  </header>

  <!-- Classification Action Buckets -->
  <section class="segmented-control-container">
    <div class="segmented-control">
      <button class="segment-btn active" data-bucket="PENDING_SCHEDULE">
        Pending for Schedule <span id="b-count-pending" class="count-pill">0</span>
      </button>
      <button class="segment-btn" data-bucket="SCHEDULE_INCOMPLETE">
        Schedule Incomplete <span id="b-count-incomplete" class="count-pill">0</span>
      </button>
      <button class="segment-btn" data-bucket="PROGRAM_COMPLETE">
        Program Complete <span id="b-count-complete" class="count-pill">0</span>
      </button>
      <button class="segment-btn" data-bucket="ALL">
        All Accounts <span id="b-count-all" class="count-pill">0</span>
      </button>
    </div>
  </section>

  <!-- Multi-Field Filter Bar -->
  <section class="filter-bar ios-search-bar">
    <div class="search-input-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="filter-search" placeholder="Search client, doctor, email, phone..." />
    </div>
    <div class="search-input-wrapper">
      <span class="search-icon">🎓</span>
      <input type="text" id="filter-course" placeholder="Filter by item name..." />
    </div>
    <select id="filter-event" class="ios-select">
      <option value="ALL">All Events</option>
      <option value="Conditions & Statistic Management Seminar">Conditions & Statistic Management Seminar</option>
      <option value="DSO Summit">DSO Summit</option>
      <option value="Financial Planning & Profitability Seminar">Financial Planning & Profitability Seminar</option>
      <option value="Get Out of Network Blueprint">Get Out of Network Blueprint</option>
      <option value="Management Tools & Troubleshooting Seminar">Management Tools & Troubleshooting Seminar</option>
      <option value="Marketing Seminar">Marketing Seminar</option>
      <option value="New Patient Workshop">New Patient Workshop</option>
      <option value="OM Bootcamp">OM Bootcamp</option>
      <option value="Organizing Board & Teambuilding Seminar">Organizing Board & Teambuilding Seminar</option>
      <option value="Owner's Conference">Owner's Conference</option>
      <option value="Sales Seminar A">Sales Seminar A</option>
      <option value="Sales Seminar B">Sales Seminar B</option>
      <option value="Sales Seminar C">Sales Seminar C</option>
      <option value="Sales Team Bootcamp">Sales Team Bootcamp</option>
      <option value="Scheduling for Production Seminar">Scheduling for Production Seminar</option>
      <option value="The Goals & Strategic Planning Workshop">The Goals & Strategic Planning Workshop</option>
    </select>
    <select id="filter-consultant" class="ios-select">
      <option value="ALL">All Consultants</option>
    </select>
    <select id="filter-expired" class="ios-select">
      <option value="ALL">All Expiration Statuses</option>
      <option value="has_expired">Has Expired Services</option>
      <option value="no_expired">No Expired Services</option>
    </select>
  </section>

  <!-- Split-Screen Triage Workbench -->
  <main class="workbench">
    <section id="client-list" class="client-list-pane"></section>
    <section id="client-detail" class="detail-pane">
      <div class="empty-state">
        <span class="empty-icon">📄</span>
        <p>No Client Selected</p>
        <p class="empty-subtext">Select a client from the list to view details.</p>
      </div>
    </section>
  </main>

  <script src="js/app.js?v=8"></script>
</body>
</html>
